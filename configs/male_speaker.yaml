experiment_description: Training with a male speaker; speaker_id set to 2. Hypothesis - a male speaker may have different acoustic characteristics that the model needs to learn.

# Dataset and text preprocessing
data_root: ./dataset/
output_split_dir: null # Uses output_dir/splits if not specified.
seed: 42
split_ratios: [0.9, 0.05, 0.05]
subset_size: null
lowercase: true
add_blank: true
suppress_word_mismatch_warnings: true # Hide only phonemizer word-count mismatch warnings.
preprocess_token_ids: true # Cache tokens in memory before data-loader workers start.

# Audio preprocessing
target_sr: 22050
min_duration_sec: 1.0
max_duration_sec: 10.0
trim_db: 40.0
pad_tail: 0.05

# Spectrogram configuration
n_fft: 1024
hop_length: 256
win_length: 1024
n_mels: 80
f_min: 0.0
f_max: 8000.0

# Model checkpoint
model_name_or_path: ylacombe/vits-vctk-with-discriminator
speaker_id: 2

# Training
# Base output folder; run files are stored in its fixed run/ subdirectory.
output_dir: outputs/male_speaker/
num_train_epochs: 15
num_workers: 4
persistent_workers: true # Keep worker processes alive between epochs; ignored with zero workers.
gradient_accumulation_steps: 1
gradient_checkpointing: false
per_device_train_batch_size: 32
learning_rate: 0.00002
adam_beta1: 0.8
adam_beta2: 0.99
warmup_ratio: 0.02 # Fraction of total steps to use for linear warmup. Set to 0 to disable warmup.
mixed_precision: bf16 # Use bfloat16 mixed precision for training if supported by the hardware.
use_linear_lr_schedule: true  # Set false to keep the learning rate constant.
encoder_layerdrop: 0.0 # Dropout rate for encoder layers. It's 0.1 by default in the original VITS configuration, but 0 works much better here
freeze_text_encoder: false # Whether to freeze the text encoder during training.

# Evaluation
do_eval: true
eval_steps: 50
per_device_eval_batch_size: 32
max_eval_samples: 1000

# Loss weights
weight_disc: 3
weight_fmaps: 1.0
weight_gen: 1
weight_kl: 1.5
weight_duration: 1
weight_mel: 35
