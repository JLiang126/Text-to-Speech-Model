experiment_description: Training with speaker embedding set to most similar speaker; speaker_id set to 7. Hypothesis - a similar speaker may have similar acoustic characteristics that the model needs to learn.

# Dataset and text preprocessing
data_root: ./dataset/
output_split_dir: null # Uses output_dir/splits if not specified.
seed: 42
split_ratios: [0.8, 0.1, 0.1]
subset_size: null
lowercase: false
add_blank: true
suppress_word_mismatch_warnings: true # Hide only phonemizer word-count mismatch warnings.

# Audio preprocessing
target_sr: 22050
min_duration_sec: 1.0
max_duration_sec: 10.0
trim_db: 40.0
pad_tail: 0.05

# Spectrogram configuration
n_fft: 1024
hop_length: 256
win_length: 1024
n_mels: 80
f_min: 0.0
f_max: 8000.0

# Model checkpoint
model_name_or_path: ylacombe/vits-vctk-with-discriminator
speaker_id: 7

# Training
# Base output folder; run files are stored in its fixed run/ subdirectory.
output_dir: outputs/trial_run/
num_train_epochs: 15
num_workers: 0 # Single-process loading avoids multiprocessing issues during a local Mac smoke test.
persistent_workers: false
gradient_accumulation_steps: 1
gradient_checkpointing: false
per_device_train_batch_size: 32
learning_rate: 0.00004
adam_beta1: 0.8
adam_beta2: 0.99
warmup_ratio: 0.02 # Fraction of total steps to use for linear warmup. Set to 0 to disable warmup.
mixed_precision: "no" # Keep the smoke test compatible with CPU and Apple Silicon.
use_linear_lr_schedule: true  # Set false to keep the learning rate constant.
encoder_layerdrop: 0.0 # Dropout rate for encoder layers. It's 0.1 by default in the original VITS configuration, but 0 works much better here
freeze_mode: none # Options: none, freeze_text_encoder, unfreeze_speech_embeddings_only
speaker_embedding_lr_ratio: 1.0

# Evaluation
do_eval: true
per_device_eval_batch_size: 32
max_eval_samples: null

# Loss weights
weight_disc: 3
weight_fmaps: 1.0
weight_gen: 1
weight_kl: 1.5
weight_duration: 1
weight_mel: 35
